# =============================================================================
# FIELD RESTRICTIONS
# Fields with group-based visibility in views
# =============================================================================

field_restrictions:
  - model: spp.program
    field_name: company_id
    groups: [base.group_multi_company]
    reason: "Only relevant in multi-company installations"

  - model: spp.cycle
    field_name: company_id
    groups: [base.group_multi_company]
    reason: "Only relevant in multi-company installations"

  - model: spp.entitlement
    field_name: company_id
    groups: [base.group_multi_company]
    reason: "Only relevant in multi-company installations"

  - model: spp.payment
    field_name: company_id
    groups: [base.group_multi_company]
    reason: "Only relevant in multi-company installations"

  - model: spp.payment.batch
    field_name: company_id
    groups: [base.group_multi_company]
    reason: "Only relevant in multi-company installations"

  - model: res.partner
    field_name: program_membership_ids
    groups: [spp_registry.group_registry_officer, spp_security.group_spp_admin]
    reason: "Only registry officers and admins need program membership view"

  - model: res.partner
    field_name: entitlement_ids
    groups: [spp_registry.group_registry_officer, spp_security.group_spp_admin]
    reason: "Only registry officers and admins need entitlement view"

# =============================================================================
# BUTTON RESTRICTIONS
# Buttons that are restricted to specific groups
# =============================================================================

button_restrictions:
  - model: spp.cycle
    button_name: action_print_summary
    groups:
      [group_programs_manager, group_programs_validator, spp_security.group_spp_admin]
    reason: "Only managers, validators, and admins can print cycle summaries"

# =============================================================================
# ACTION RESTRICTIONS
# Actions that are restricted to specific groups
# =============================================================================

actions: []
