# OpenSPP Access Management Compliance Specification
# Module: spp_programs
# Version: 1.0
#
# This file declares the expected access control configuration for this module.
# Run: python -m scripts.compliance.checker spp_programs
# Generate tests: python -m scripts.compliance.test_generator spp_programs

module: spp_programs
domain: programs
version: "1.0"

# =============================================================================
# GROUP DEFINITIONS
# Following ADR-004 Three-Tier Architecture
# =============================================================================

groups:
  # --- Tier 3: Technical base groups ---
  - id: group_programs_read
    tier: 3
    comment: "Technical group for read access to programs models."

  - id: group_programs_write
    tier: 3
    implied_ids: [group_programs_read]
    comment: "Technical group for write access to programs models."

  - id: group_programs_create
    tier: 3
    implied_ids: [group_programs_read]
    comment: "Technical group for create access to program/cycle/entitlement models."

  # --- Tier 2: User-facing groups ---
  - id: group_programs_viewer
    tier: 2
    privilege_id: privilege_programs_viewer
    implied_ids: [group_programs_read]
    comment: "Can view program records. Cannot modify data."

  - id: group_programs_officer
    tier: 2
    privilege_id: privilege_programs_officer
    implied_ids: [group_programs_viewer, group_programs_write, group_programs_create]
    comment: "Can view and edit program records. Cannot delete."

  - id: group_programs_manager
    tier: 2
    privilege_id: privilege_programs_manager
    implied_ids: [group_programs_officer]
    comment: "Full programs management; deletion controlled by access rules."

  # --- Special role groups ---
  - id: group_programs_validator
    tier: 2
    privilege_id: privilege_programs_validator
    implied_ids: [group_programs_officer]
    comment: "SPECIALIZED ROLE: Can validate finance operations."

  - id: group_programs_rejector
    tier: 2
    privilege_id: privilege_programs_rejector
    implied_ids: [group_programs_read]
    comment:
      "SPECIALIZED ROLE: Can reject entitlements. This is a functional role (not part of
      Viewer/Officer/Manager hierarchy)."

  - id: group_programs_cycle_approver
    tier: 2
    privilege_id: privilege_cycle_approver
    implied_ids: [group_programs_read]
    comment:
      "SPECIALIZED ROLE: Can approve cycles. This is a functional role (not part of
      Viewer/Officer/Manager hierarchy)."

# Admin linkage - manager group links to spp_security.group_spp_admin
admin_link_group: group_programs_manager

