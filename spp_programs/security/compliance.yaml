# =============================================================================
# RECORD RULES (ir.rule)
# Data visibility rules based on group membership
# =============================================================================

record_rules:
  - id: rule_spp_program_membership_disabled
    model: spp.program.membership
    global: true
    domain_description: "Exclude program memberships for disabled partners"
    perm_read: true
    perm_write: false
    perm_create: false
    perm_unlink: false

  - id: rule_spp_program_membership_disabled_edit
    model: spp.program.membership
    groups: [group_programs_officer, group_programs_manager]
    domain_description:
      "Allow officers/managers to manage memberships for active partners"
    perm_read: true
    perm_write: true
    perm_create: true
    perm_unlink: true

  - id: rule_spp_cycle_membership_disabled
    model: spp.cycle.membership
    global: true
    domain_description: "Exclude cycle memberships for disabled partners"
    perm_read: true
    perm_write: false
    perm_create: false
    perm_unlink: false

  - id: rule_spp_cycle_membership_disabled_edit
    model: spp.cycle.membership
    groups: [group_programs_officer, group_programs_manager]
    domain_description:
      "Allow officers/managers to manage cycle memberships for active partners"
    perm_read: true
    perm_write: true
    perm_create: true
    perm_unlink: true

  - id: rule_spp_program_company
    model: spp.program
    global: true
    domain_description:
      "Multi-company access: programs with no company or user's companies"
    perm_read: true
    perm_write: true
    perm_create: true
    perm_unlink: true

