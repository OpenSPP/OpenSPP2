# OpenSPP Access Management Compliance Specification
# Module: spp_security
# Version: 1.0
#
# This file declares the expected access control configuration for this module.
# Run: python -m scripts.compliance.checker spp_security
# Generate tests: python -m scripts.compliance.test_generator spp_security

module: spp_security
domain: admin
version: "1.0"

# =============================================================================
# GROUP DEFINITIONS
# Following ADR-004 Three-Tier Architecture
# =============================================================================

groups:
  # --- Tier 2: User-facing groups ---
  - id: group_spp_admin
    tier: 2
    privilege_id: privilege_spp_admin
    comment:
      "Full administrative access to all OpenSPP modules. This group automatically inherits all manager-level
      permissions from installed domain modules. Assign this group to system administrators who need complete access."

  - id: group_access_restrict_self
    tier: 2
    privilege_id: privilege_access_restrict_self_officer
    comment: "Users in this group can only see their own user record. Used for field agents and limited-access users."

# Admin linkage - this module IS the admin module, no linkage needed
# Domain modules should link their manager groups to group_spp_admin
admin_link_group: null

# =============================================================================
# MODEL ACCESS (ir.model.access.csv)
# This module defines no model access - it only provides groups and rules
# =============================================================================

model_access: []

# =============================================================================
# RECORD RULES (ir.rule)
# Foundation record rules that apply across OpenSPP modules
# =============================================================================

record_rules:
  # Multi-company access rule for partners
  - id: rule_partner_company
    model: res.partner
    groups: [] # Global rule (no specific groups)
    domain_description:
      "Partners: Multi-company access - users can only see partners from their companies or without company"
    perm_read: true
    perm_write: true
    perm_create: true
    perm_unlink: true
    global: true
    comment:
      "Global multi-company rule ensuring users only access partners from their assigned companies or company-neutral
      records"

  # Self-only access rule for users with restricted access
  - id: rule_user_self_only
    model: res.users
    groups: [group_access_restrict_self]
    domain_description: "Users: See only self - users can only see their own user record"
    perm_read: true
    perm_write: false
    perm_create: false
    perm_unlink: false
    comment: "Restricts users in group_access_restrict_self to only view their own user record"

# =============================================================================
# MENU VISIBILITY
# This module defines no menus - menus are defined in domain modules
# =============================================================================

menus: []

# =============================================================================
# FIELD RESTRICTIONS
# This module defines no field restrictions
# =============================================================================

field_restrictions: []

# =============================================================================
# ACTION RESTRICTIONS
# This module defines no action restrictions
# =============================================================================

actions: []

# =============================================================================
# PRIVILEGES
# Privileges defined in this module (res.groups.privilege)
# =============================================================================

privileges:
  - id: privilege_spp_admin
    name: Administrator
    category_id: category_spp_admin
    sequence: 1
    comment: "Top-level administrative privilege for complete OpenSPP access"

  - id: privilege_access_restrict_self_officer
    name: "Restricted: Self Only (Officer)"
    category_id: category_spp_admin
    sequence: 10
    comment: "Utility privilege for self-only access restriction"

# =============================================================================
