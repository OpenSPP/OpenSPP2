# =============================================================================
# ARCHITECTURE NOTES
# =============================================================================
#
# This module (spp_security) is the foundation security module for OpenSPP.
# It defines:
#
# 1. The central Administrator group (group_spp_admin) that all domain
#    manager groups inherit from
#
# 2. All module categories for organizing security groups in the UI
#
# 3. Foundation record rules (multi-company, self-only access)
#
# 4. Utility groups like group_access_restrict_self for special access patterns
#
# Domain modules (spp_registry_base, spp_programs, etc.) extend this by:
# - Defining their own three-tier groups (viewer/officer/manager)
# - Linking their manager group to group_spp_admin via implied_ids
# - Adding domain-specific privileges under the appropriate category
# - Implementing domain-specific record rules and model access
#
# This ensures:
# - Clean separation: only installed domains appear in the UI
# - Automatic admin access: admins get all manager permissions
# - Consistent architecture: all domains follow the same pattern
