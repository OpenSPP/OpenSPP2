# Local override - use unique image name to avoid collision with openspp-modules-v2
services:
  openspp:
    image: openspp2-dev
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev

  openspp-dev:
    image: openspp2-dev
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev

  jobworker:
    image: openspp2-dev
    volumes:
      - ../odoo-job-worker:/mnt/extra-addons/odoo-job-worker:ro,z

  test:
    image: openspp2-dev
