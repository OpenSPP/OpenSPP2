# OpenSPP Access Management Compliance Specification
# Module: spp_registry
# Version: 1.0
#
# This file declares the expected access control configuration for this module.
# Run: python -m scripts.compliance.checker spp_registry
# Generate tests: python -m scripts.compliance.test_generator spp_registry

module: spp_registry
domain: registry
version: "1.0"

# =============================================================================
# GROUP DEFINITIONS
# Following ADR-004 Three-Tier Architecture
# =============================================================================

groups:
  # --- Tier 3: Technical base groups ---
  - id: group_registry_read
    tier: 3
    comment: "Technical group for read access to registry models."

  - id: group_registry_write
    tier: 3
    implied_ids: [group_registry_read]
    comment: "Technical group for write access to registry models."

  - id: group_registry_create
    tier: 3
    implied_ids: [group_registry_read]
    comment: "Technical group for registry create access."

  # --- Tier 2: User-facing groups ---
  - id: group_registry_viewer
    tier: 2
    privilege_id: privilege_registry_viewer
    implied_ids: [group_registry_read]
    comment: "Can view registry records. Cannot modify data."

  - id: group_registry_officer
    tier: 2
    privilege_id: privilege_registry_officer
    implied_ids: [group_registry_viewer, group_registry_write, group_registry_create]
    comment: "Can view and edit registry records. Cannot delete."

  - id: group_registry_manager
    tier: 2
    privilege_id: privilege_registry_manager
    implied_ids: [group_registry_officer, group_registry_config_admin]
    comment: "Full registry management including delete operations."

  # --- Special groups ---
  - id: group_registry_config_admin
    tier: 2
    privilege_id: privilege_registry_config_admin
    comment: "Access to configuration menus; implied by Registry Manager."

  - id: group_registry_restrict_self
    tier: 2
    privilege_id: privilege_registry_restrict_self_officer
    comment: "Restrict access to only see own records. Can be combined with other groups."

# Admin linkage - manager group links to spp_security.group_spp_admin
admin_link_group: group_registry_manager

# =============================================================================
# MODEL ACCESS (ir.model.access.csv)
# Standard pattern: viewer=read, officer=read+write+create, manager=full CRUD
# =============================================================================

model_access:
  # Core registrant model
  - model: res.partner
    viewer: [read]
    officer: [read, write, create]
    manager: [read, write, create, unlink]

  # Registry relationships
  - model: spp.registry.relationship
    viewer: [read]
    officer: [read, write, create]
    manager: [read, write, create, unlink]

  # Registrant IDs
  - model: spp.registry.id
    viewer: [read]
    officer: [read, write, create]
    manager: [read, write, create, unlink]

  # ID Types (configuration)
  - model: spp.id.type
    viewer: [read]
    officer: [read, write, create]
    manager: [read, write, create, unlink]

  # Relationship types
  - model: spp.relationship
    viewer: [read]
    officer: [read]
    manager: [read, write, create, unlink]

  # Phone numbers
  - model: spp.phone.number
    viewer: [read]
    officer: [read, write, create]
    manager: [read, write, create, unlink]

  # Background tasks
  - model: spp.queue.background.task
    viewer: [read]
    officer: [read, write, create]
    manager: [read, write, create, unlink]

  # Disable registrant wizard
  - model: spp.disable.registrant.wizard
    viewer: [read]
    officer: [read, write, create]
    manager: [read, write, create, unlink]

# =============================================================================
# RECORD RULES (ir.rule)
# Data visibility rules based on group membership
# =============================================================================

record_rules:
  - id: rule_res_users_self
    model: res.users
    groups: [group_registry_restrict_self]
    domain_description: "User can only see their own user record"
    perm_read: true
    perm_write: false
    perm_create: false
    perm_unlink: false

  - id: rule_res_partner_self
    model: res.partner
    groups: [group_registry_restrict_self]
    domain_description: "User can only see their own partner record"
    perm_read: true
    perm_write: false
    perm_create: false
    perm_unlink: false

  - id: rule_spp_group_membership_group
    model: spp.group.membership
    global: true
    domain_description: "Exclude memberships linked to disabled groups"
    perm_read: true
    perm_write: false
    perm_create: false
    perm_unlink: false

  - id: rule_spp_group_membership_group_edit
    model: spp.group.membership
    groups: [group_registry_officer, group_registry_manager]
    domain_description: "Allow officers/managers to manage memberships for active groups"
    perm_read: true
    perm_write: true
    perm_create: true
    perm_unlink: true

  - id: rule_spp_group_membership_individual
    model: spp.group.membership
    global: true
    domain_description: "Exclude memberships for disabled individuals"
    perm_read: true
    perm_write: false
    perm_create: false
    perm_unlink: false

  - id: rule_spp_group_membership_individual_edit
    model: spp.group.membership
    groups: [group_registry_officer, group_registry_manager]
    domain_description: "Allow officers/managers to manage memberships for active individuals"
    perm_read: true
    perm_write: true
    perm_create: true
    perm_unlink: true

# =============================================================================
# MENU VISIBILITY
# Which groups can see which menus
# =============================================================================

menus:
  - id: spp_main_menu_root
    name: "Registry"
    groups: [spp_security.group_spp_admin, group_registry_viewer, group_registry_officer, group_registry_manager]

  - id: spp_configuration_menu_root
    name: "Configuration"
    parent: spp_main_menu_root
    groups: [spp_security.group_spp_admin, group_registry_config_admin]

  - id: menu_relationship
    name: "Relationships"
    parent: spp_configuration_menu_root
    groups: [spp_security.group_spp_admin, group_registry_manager]

# =============================================================================
# FIELD RESTRICTIONS
# Fields with group-based visibility in views
# =============================================================================

field_restrictions:
  - view_id: view_partner_form
    field_name: company_id
    groups: [base.group_multi_company]
    reason: "Only relevant in multi-company installations"

# =============================================================================
# ACTION RESTRICTIONS
# Actions that are restricted to specific groups
# =============================================================================

actions: []
