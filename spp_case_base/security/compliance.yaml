# =============================================================================
# FIELD RESTRICTIONS
# Fields with group-based visibility in views
# =============================================================================

field_restrictions: []

# =============================================================================
# ACTION RESTRICTIONS
# Actions that are restricted to specific groups
# =============================================================================

actions: []
# =============================================================================
# NOTES
# =============================================================================

# Role Hierarchy:
# - Viewer: Read-only access to cases (via UI, limited by record rules)
# - Worker: Manage own assigned cases and activities
# - Supervisor: Manage team cases and approve plans
# - Officer: Edit all case records (standard role)
# - Manager: Full access including configuration and delete
#
# Record Rules:
# - Worker: Can only see cases where case_worker_id = user.id
# - Supervisor: Can see cases where supervisor_id = user.id or team supervisor
# - Manager: Can see all cases (domain: [(1, '=', 1)])
