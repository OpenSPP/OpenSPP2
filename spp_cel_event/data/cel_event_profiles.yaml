# CEL Event Data Integration Profiles
#
# This file defines CEL function profiles that integrate event data
# into eligibility and entitlement expressions.
#
# These profiles extend the base CEL domain language with event-specific
# functions for querying survey responses, field visit data, and other
# time-series event information.
#
# Examples:
#   - event('survey_code', 'field_name') - Get field value from most recent event
#   - event_count('survey_code') - Count events of a type for the registrant
#   - event_exists('survey_code') - Check if registrant has any event of type
#   - event_between('survey_code', date1, date2) - Get events in date range
#
# Profile definitions will be added as the CEL event functions are implemented.

profiles: []
