# OpenSPP Access Management Compliance Specification
# Module: spp_service_points
# Version: 1.0
#
# This file declares the expected access control configuration for this module.
# Run: python -m scripts.compliance.checker spp_service_points
# Generate tests: python -m scripts.compliance.test_generator spp_service_points

module: spp_service_points
domain: service_points
version: "1.0"

# =============================================================================
# GROUP DEFINITIONS
# Following ADR-004 Three-Tier Architecture
# =============================================================================

groups:
  # --- Tier 3: Technical base groups ---
  - id: group_service_points_read
    tier: 3
    comment: "Technical group for read access to service point models."

  - id: group_service_points_write
    tier: 3
    implied_ids: [group_service_points_read]
    comment: "Technical group for write access to service point models."

  - id: group_service_points_create
    tier: 3
    implied_ids: [group_service_points_read]
    comment:
      "Technical group for service point create access. Grants permission to create new
      service points and types."

  # --- Tier 2: User-facing groups ---
  - id: group_service_points_viewer
    tier: 2
    privilege_id: privilege_service_points_viewer
    implied_ids: [group_service_points_read]
    comment:
      "Can view service points and types. Cannot modify data. Useful for users who need
      to reference service points."

  - id: group_service_points_officer
    tier: 2
    privilege_id: privilege_service_points_officer
    implied_ids:
      [
        group_service_points_viewer,
        group_service_points_write,
        group_service_points_create,
      ]
    comment:
      "Can view and edit service points and types. Can create new service points. Cannot
      delete. Standard role for service point coordinators."

  - id: group_service_points_manager
    tier: 2
    privilege_id: privilege_service_points_manager
    implied_ids: [group_service_points_officer]
    comment:
      "Full service point management including delete operations and configuration
      access. For service point administrators."

  # Note: Existing group_service_points_user should be deprecated in favor of group_service_points_officer
  # service_point_users is already marked as deprecated

# Admin linkage - manager group links to spp_security.group_spp_admin
admin_link_group: group_service_points_manager

# =============================================================================
# MODEL ACCESS (ir.model.access.csv)
# Standard pattern: viewer=read, officer=read+write+create, manager=full CRUD
# =============================================================================

model_access:
  # Service Point model - Physical/virtual locations for service delivery
  - model: spp.service.point
    viewer: [read]
    officer: [read, write, create]
    manager: [read, write, create, unlink]

# =============================================================================
# RECORD RULES (ir.rule)
# Data visibility rules based on group membership
# =============================================================================

record_rules:
  # Global read access for all authenticated users to service points
  # Service points are reference data that should be visible to all users
  - id: rule_service_point_global_read
    model: spp.service.point
    groups: [] # Global rule applies to all users
    domain_description: "All authenticated users can read service points"
    perm_read: true
    perm_write: false
    perm_create: false
    perm_unlink: false
    global: true

# =============================================================================
# MENU VISIBILITY
# Which groups can see which menus
# =============================================================================

menus:
  # Service Points main menu - Top level menu with custom icon
  # Should be accessible to all service points users, not just admins
  - id: service_points_main_menu_root
    name: "Service Point"
    groups: [group_service_points_viewer]
    comment:
      "Main service points menu. Currently restricted to admin only, should be
      accessible to all service points users."

  # Service Points list menu - Access to service points management
  - id: menu_service_points
    name: "Service Points"
    parent: service_points_main_menu_root
    action: action_service_points
    groups: [group_service_points_viewer]
    comment:
      "Currently restricted to admin. Should be visible to viewers (read-only via ACL)."

  # Configuration menu - For service types and settings
  - id: service_points_configuration_menu_root
    name: "Configuration"
    parent: service_points_main_menu_root
    groups: [group_service_points_manager]
    comment: "Configuration menu should be restricted to managers only."

# =============================================================================
# FIELD RESTRICTIONS
# Fields with group-based visibility in views
# =============================================================================

field_restrictions:
  # Disable/Enable service point actions should be restricted to managers
  - field_name: is_disabled
    model: spp.service.point
    view_type: form
    groups: [group_service_points_manager]
    comment: "Disabling service points should be manager-only action."

  - field_name: disabled_reason
    model: spp.service.point
    view_type: form
    groups: [group_service_points_manager]
    comment: "Disable reason management restricted to managers."

# =============================================================================
# ACTION RESTRICTIONS
# Actions that are restricted to specific groups
# =============================================================================

actions:
  # Disable service point button action
  - id: disable_service_point
    type: object
    model: spp.service.point
    groups: [group_service_points_manager]
    comment: "Only managers should be able to disable service points."

  # Enable service point button action
  - id: enable_service_point
    type: object
    model: spp.service.point
    groups: [group_service_points_manager]
    comment: "Only managers should be able to enable disabled service points."

  # Create user from service point - sensitive operation
  - id: create_user
    type: object
    model: spp.service.point
    groups: [group_service_points_manager]
    comment: "Creating user accounts should be restricted to managers only."

# =============================================================================
# KNOWN ISSUES & GAPS
# Document differences between ideal and current implementation
# =============================================================================

issues:
  - issue: "Missing tier 3 technical groups"
    severity: medium
    description:
      "Module lacks group_service_points_read, group_service_points_write, and
      group_service_points_create technical groups."
    fix: "Add tier 3 groups to security/security_group.xml"

  - issue: "Missing viewer and manager groups"
    severity: medium
    description:
      "Only group_service_points_user exists. Missing group_service_points_viewer and
      group_service_points_manager."
    fix: "Add missing tier 2 groups with appropriate privileges."

  - issue: "Missing privileges"
    severity: medium
    description:
      "Only privilege_service_points_user exists. Need privilege_service_points_viewer
      and privilege_service_points_manager."
    fix: "Add missing privileges to security/privileges.xml"

  - issue: "Menu restricted to admin only"
    severity: high
    description:
      "menu_service_points currently restricted to spp_security.group_spp_admin. Should
      be accessible to service points users."
    fix: "Change menu groups to group_service_points_viewer"

  - issue: "No record rules"
    severity: medium
    description:
      "Module has no record rules. Service points should have global read access as
      reference data."
    fix: "Add record rules for global read access to both models."

  - issue: "ACL references external groups"
    severity: low
    description:
      "ir.model.access.csv includes entries for spp_registry.group_registry_officer,
      creating tight coupling."
    recommendation:
      "Registry officers needing service point access should be granted
      group_service_points_officer via role composition or explicit assignment."

  - issue: "Deprecated group still referenced"
    severity: low
    description:
      "service_point_users deprecated group is still referenced in registrant.py:213"
    fix:
      "Update code reference to use group_service_points_user (or new
      group_service_points_officer)"

  - issue: "Button actions lack group restrictions"
    severity: medium
    description:
      "disable_service_point, enable_service_point, and create_user buttons in form view
      lack explicit group restrictions in Python methods."
    fix:
      "Add @api.depends or security checks to these methods, or restrict via view groups
      attribute."

# =============================================================================
# MIGRATION NOTES
# Guidance for implementing the ideal security model
# =============================================================================

migration_notes: |
  1. Create tier 3 technical groups (read, write, create)
  2. Add viewer and manager privileges to privileges.xml
  3. Create viewer and manager groups linking to new privileges
  4. Update ir.model.access.csv to follow viewer/officer/manager pattern
  5. Remove ACL entries for external groups (spp_registry.group_registry_officer)
  6. Add record rules for global read access
  7. Update menu restrictions from admin to viewer
  8. Consider deprecating group_service_points_user in favor of group_service_points_officer
  9. Add method-level security decorators for sensitive actions
  10. Link manager group to spp_security.group_spp_admin via implied_ids
