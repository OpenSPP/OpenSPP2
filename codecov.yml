# Codecov configuration for OpenSPP
# https://docs.codecov.io/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        # Informational only - don't block PRs on project-wide coverage.
        # CI only tests changed modules (max 15), so project coverage fluctuates
        # depending on which modules are in the test matrix.
        informational: true
        only_pulls: true
    patch:
      default:
        target: 70%

# Each module uploads with its own flag (flags: ${{ matrix.module }} in CI).
# Carry forward coverage from previous commits so modules not tested in this
# PR still contribute to overall project coverage.
flag_management:
  default_rules:
    carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

ignore:
  - "**/tests/**"
  - "**/__manifest__.py"
  - "**/migrations/**"
  - "scripts/**"
