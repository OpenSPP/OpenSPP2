# PostgreSQL configuration for OpenSPP development
#
# This file is mounted into the db container. Settings here are overridden
# by any -c flags passed via the docker-compose command.

# ---------------------------------------------------------------------------
# Logging: slow queries and diagnostics
# ---------------------------------------------------------------------------

# Log queries slower than this (in milliseconds). Set to 0 to log all queries.
# Override at start time with: ./spp start --slow-queries=200
log_min_duration_statement = 500

# Prefix each log line with useful context for parsing
log_line_prefix = '%m [%p] %d '

# Log lock waits longer than deadlock_timeout (default 1s)
log_lock_waits = on

# Log all temporary file usage (0 = log all, -1 = disable)
log_temp_files = 0

# Log checkpoint activity
log_checkpoints = on

# Log connection/disconnection (useful for debugging connection leaks)
log_connections = off
log_disconnections = off

# ---------------------------------------------------------------------------
# Memory (tuned for dev containers, not production)
# ---------------------------------------------------------------------------

shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB

# ---------------------------------------------------------------------------
# Query planner
# ---------------------------------------------------------------------------

# Help the planner make better estimates for PostGIS queries
random_page_cost = 1.1
effective_cache_size = 512MB

# ---------------------------------------------------------------------------
# WAL (relaxed for dev, prioritize speed over durability)
# ---------------------------------------------------------------------------

fsync = off
synchronous_commit = off
full_page_writes = off

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------

max_connections = 200

listen_addresses = '*'
