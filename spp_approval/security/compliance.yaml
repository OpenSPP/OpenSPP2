# OpenSPP Access Management Compliance Specification
# Module: spp_approval
# Version: 1.0
#
# This file declares the expected access control configuration for this module.
# Run: python -m scripts.compliance.checker spp_approval
# Generate tests: python -m scripts.compliance.test_generator spp_approval

module: spp_approval
domain: approval
version: "1.0"

# =============================================================================
# GROUP DEFINITIONS
# Following ADR-004 Three-Tier Architecture
# =============================================================================

groups:
  # --- Tier 3: Technical base groups ---
  - id: group_approval_read
    tier: 3
    comment: "Technical group for read access to approval models."

  - id: group_approval_write
    tier: 3
    implied_ids: [group_approval_read]
    comment: "Technical group for write access to approval models."

  # --- Tier 2: User-facing groups ---
  - id: group_approval_viewer
    tier: 2
    privilege_id: privilege_approval_viewer
    implied_ids: [group_approval_read]
    comment: "Can view approval records. Cannot modify data."

  - id: group_approval_officer
    tier: 2
    privilege_id: privilege_approval_officer
    implied_ids: [group_approval_viewer, group_approval_write]
    comment: "Can view and edit approval records. Cannot delete."

  - id: group_approval_manager
    tier: 2
    privilege_id: privilege_approval_manager
    implied_ids: [group_approval_officer]
    comment: "Full approval management including delete operations."

  # --- Special groups ---
  - id: group_approval_approver
    tier: 2
    privilege_id: privilege_approval_approver
    implied_ids: [group_approval_viewer]
    comment:
      "SPECIALIZED ROLE: Can approve or reject records assigned to them. This is a
      functional role (not part of Viewer/Officer/Manager hierarchy). Inherits Viewer
      permissions. Assign alongside or instead of Officer based on workflow needs."

  # --- Backward compatibility ---
  - id: group_approval_admin
    tier: 2
    implied_ids: [group_approval_manager]
    comment:
      "Deprecated: Use group_approval_manager instead. This group is kept for backward
      compatibility."

# Admin linkage - manager group links to spp_security.group_spp_admin
admin_link_group: group_approval_manager

# =============================================================================
# MODEL ACCESS (ir.model.access.csv)
# Standard pattern: viewer=read, officer=read+write+create, manager=full CRUD
# Approver has specialized access patterns for workflow actions
# =============================================================================

model_access:
  # Approval definitions - configures approval workflows
  - model: spp.approval.definition
    viewer: [read]
    officer: [read, write, create]
    manager: [read, write, create, unlink]

  # Approval reviews - tracks individual approval requests
  # Note: Approver has read+write (no create/unlink), Manager has read+write+create+unlink
  # Viewer sees reviews via record rules, Approver acts on assigned reviews
  - model: spp.approval.review
    viewer: [read]
    approver: [read, write]
    manager: [read, write, create, unlink]

  # System configuration for approval behavior
  # Note: No officer access - config is viewer (read-only) or manager (full)
  - model: spp.approval.config
    viewer: [read]
    officer: [] # No officer access for config
    manager: [read, write, create, unlink]

  # Freeze periods - blocks approvals during specific periods
  - model: spp.approval.freeze
    viewer: [read]
    officer: [read, write, create]
    manager: [read, write, create, unlink]

  # Rejection wizard - used by approvers to reject with comments
  # Only approvers use this wizard, not viewer/officer/manager
  - model: spp.approval.rejection.wizard
    viewer: [] # Wizards are transient, not viewable
    officer: []
    manager: [] # Approvers have their own ACL for this
    approver: [read, write, create, unlink]

  # Revision wizard - used by approvers to request revisions
  # Only approvers use this wizard, not viewer/officer/manager
  - model: spp.approval.revision.wizard
    viewer: []
    officer: []
    manager: []
    approver: [read, write, create, unlink]

# =============================================================================
# RECORD RULES (ir.rule)
# Data visibility rules based on group membership
# =============================================================================

record_rules:
  # Approvers can only see reviews they requested or are assigned to
  - id: rule_spp_approval_review_approver
    model: spp.approval.review
    groups: [group_approval_approver]
    domain_description:
      "Approver can see reviews they requested or are assigned to via user list or group
      membership"
    perm_read: true
    perm_write: true
    perm_create: false
    perm_unlink: false

  # Managers can see all reviews
  - id: rule_spp_approval_review_manager
    model: spp.approval.review
    groups: [group_approval_manager]
    domain_description: "Manager can see all approval reviews"
    perm_read: true
    perm_write: true
    perm_create: true
    perm_unlink: false

  # Multi-company: approval definitions
  - id: rule_spp_approval_definition_company
    model: spp.approval.definition
    groups: [] # Global rule (applies to all users)
    domain_description:
      "Users can access approval definitions without company or matching their companies"
    perm_read: true
    perm_write: true
    perm_create: true
    perm_unlink: true
    global: true

  # Multi-company: freeze periods
  - id: rule_spp_approval_freeze_company
    model: spp.approval.freeze
    groups: [] # Global rule (applies to all users)
    domain_description:
      "Users can access freeze periods without company or matching their companies"
    perm_read: true
    perm_write: true
    perm_create: true
    perm_unlink: true
    global: true

# =============================================================================
# MENU VISIBILITY
# Which groups can see which menus
# =============================================================================

menus:
  # Root menu - visible to all users with approval access
  - id: menu_approval_root
    name: "Approvals"
    groups: [] # No explicit restriction - visibility via child menus

  # My Approvals submenu - visible to all
  - id: menu_my_approvals
    name: "My Approvals"
    parent: menu_approval_root
    groups: [] # Accessible to all approval users

  # Pending approvals - visible to all
  - id: menu_my_pending_approvals
    name: "Pending Approvals"
    parent: menu_my_approvals
    groups: [] # Accessible to all approval users

  # All reviews - managers only
  - id: menu_all_reviews
    name: "All Reviews"
    parent: menu_my_approvals
    groups: [group_approval_manager]

  # Configuration submenu - managers only
  - id: menu_approval_config
    name: "Configuration"
    parent: menu_approval_root
    groups: [group_approval_manager]

  # Approval definitions config
  - id: menu_approval_definitions
    name: "Approval Definitions"
    parent: menu_approval_config
    groups: [] # Inherits restriction from parent

  # Freeze periods config
  - id: menu_approval_freeze
    name: "Freeze Periods"
    parent: menu_approval_config
    groups: [] # Inherits restriction from parent

# =============================================================================
# FIELD RESTRICTIONS
# Fields with group-based visibility in views
# =============================================================================

field_restrictions:
  # Company fields only visible in multi-company setup
  - model: spp.approval.definition
    field_name: company_id
    groups: [base.group_multi_company]
    reason: "Only relevant in multi-company installations"

  - model: spp.approval.freeze
    field_name: company_id
    groups: [base.group_multi_company]
    reason: "Only relevant in multi-company installations"

# =============================================================================
# ACTION RESTRICTIONS
# Actions that are restricted to specific groups
# =============================================================================

actions:
  - id: approval_review_my_pending_action
    name: "My Pending Approvals"
    groups: [] # Available to all approval users

  - id: approval_review_action
    name: "All Approval Reviews"
    groups: [group_approval_manager]

  - id: approval_definition_action
    name: "Approval Definitions"
    groups: [group_approval_manager]

  - id: approval_freeze_action
    name: "Freeze Periods"
    groups: [group_approval_manager]
# =============================================================================
# NOTES
# =============================================================================

# Architecture Notes:
# 1. Approver is a specialized role separate from the Viewer/Officer/Manager hierarchy
#    - Inherits Viewer permissions for read access
#    - Gets write access only to assigned reviews via record rules
#    - Can use rejection/revision wizards (full CRUD for transient models)
#
# 2. Review access patterns:
#    - Viewers: Read-only access to reviews (via UI, limited by data access in practice)
#    - Approvers: Read+write on assigned reviews (enforced by record rules)
#    - Managers: Full access to all reviews (read+write+create, no unlink)
#
# 3. Multi-company support:
#    - Global rules ensure users can access records without company or in their companies
#    - Company fields hidden unless multi-company mode is enabled
#
# 4. Configuration access:
#    - Only Managers can access Configuration menu and its children
#    - This includes approval definitions and freeze periods
