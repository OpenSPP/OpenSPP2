name: Update Vocabularies

on:
  # Run monthly on the 1st at 00:00 UTC
  schedule:
    - cron: "0 0 1 * *"
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      create_pr:
        description: "Create PR for changes"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch vocabulary updates
        id: fetch
        run: |
          echo "Fetching vocabulary updates from official sources..."
          python scripts/fetch_all.py

          # Check if there are changes
          if git diff --quiet vocabularies/; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat vocabularies/
          fi

      - name: Validate updated vocabularies
        if: steps.fetch.outputs.changes == 'true'
        run: python scripts/validate.py

      - name: Create Pull Request
        if:
          steps.fetch.outputs.changes == 'true' && (github.event.inputs.create_pr !=
          'false' || github.event_name == 'schedule')
        uses: peter-evans/create-pull-request@v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update vocabularies from official sources"
          title: "chore: Update vocabularies from official sources"
          body: |
            ## Automated Vocabulary Update

            This PR was automatically generated by the vocabulary update workflow.

            ### Changes
            Updates fetched from official sources:
            - ISO 3166-1 Country Codes (DataHub.io)
            - ISO 639-1 Language Codes (DataHub.io)
            - ISO 4217 Currency Codes (DataHub.io)

            ### Review Checklist
            - [ ] Review the diff for unexpected changes
            - [ ] Verify code counts are reasonable
            - [ ] Check for any removed codes that might break existing data

            ---
            *This PR was created automatically by GitHub Actions*
          branch: chore/update-vocabularies
          delete-branch: true
          labels: |
            automated
            vocabularies

      - name: Summary
        run: |
          if [ "${{ steps.fetch.outputs.changes }}" == "true" ]; then
            echo "## Vocabulary Update Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Changes were detected and a PR has been created." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Modified Files" >> $GITHUB_STEP_SUMMARY
            git diff --name-only vocabularies/ >> $GITHUB_STEP_SUMMARY
          else
            echo "## Vocabulary Update Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No changes detected. Vocabularies are up to date." >> $GITHUB_STEP_SUMMARY
          fi
