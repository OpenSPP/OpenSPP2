name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate before release
        run: python scripts/validate.py

      - name: Generate release notes
        id: notes
        run: |
          # Count codes in each vocabulary
          echo "## Vocabulary Statistics" > release_notes.md
          echo "" >> release_notes.md
          echo "| Vocabulary | Codes |" >> release_notes.md
          echo "|------------|-------|" >> release_notes.md

          for file in vocabularies/*.json; do
            name=$(basename "$file" .json)
            count=$(python -c "import json; print(len(json.load(open('$file'))['codes']))")
            echo "| $name | $count |" >> release_notes.md
          done

          echo "" >> release_notes.md
          echo "## Changes" >> release_notes.md
          echo "" >> release_notes.md
          echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.0.6
        with:
          body_path: release_notes.md
          generate_release_notes: true
